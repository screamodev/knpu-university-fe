services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: knpu-university-fe:latest
    restart: unless-stopped
    volumes:
      - .:/opt/app
      - /opt/app/node_modules
    ports:
      - "3000:3000"
    extra_hosts:
      # Lets the app container reach Directus when it is published on the host (separate compose).
      - 'host.docker.internal:host-gateway'
    # Bind mount hides image node_modules; anonymous volume keeps deps. Entrypoint from the repo (not the image)
    # so script changes apply without rebuild. If deps are stale: docker compose -f docker-compose.dev.yml down -v && up --build
    command: ["sh", "/opt/app/docker/entrypoint-dev.sh"]
    environment:
      # pnpm refuses to replace node_modules without a TTY unless CI is set (Docker has no TTY by default).
      CI: "true"
      NUXT_HOST: 0.0.0.0
      # Browser (hydration, images): host machine where Directus port is mapped.
      NUXT_PUBLIC_DIRECTUS_URL: http://localhost:8055
      # SSR / server fetches from inside the container (localhost there is not Directus).
      NUXT_DIRECTUS_SERVER_URL: http://host.docker.internal:8055
      # Directus live preview of drafts. Must match PREVIEW_SECRET / PREVIEW_TOKEN passed to
      # knpu-university-be/snapshots/bootstrap-editor-experience.sh.
      NUXT_PREVIEW_SECRET: ${NUXT_PREVIEW_SECRET:-local-preview-secret}
      NUXT_DIRECTUS_PREVIEW_TOKEN: ${NUXT_DIRECTUS_PREVIEW_TOKEN:-local-preview-token}
