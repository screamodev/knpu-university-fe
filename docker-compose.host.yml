# Publish Nuxt to the host loopback so Hestia's nginx can proxy to it.
#
# On the dev42hub server Caddy lives inside `webnet` and reaches the container by name, so
# no port is published there. Here nginx runs on the host; 127.0.0.1 keeps the app off the
# public interface, so every request has to come through nginx (and its TLS).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.host.yml up -d
services:
  app:
    ports:
      - "127.0.0.1:3000:3000"
