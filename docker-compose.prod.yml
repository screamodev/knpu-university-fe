services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args:
        NUXT_PUBLIC_DIRECTUS_URL: ${NUXT_PUBLIC_DIRECTUS_URL}
    image: knpu-university-fe:prod
    container_name: knpu-university-fe
    restart: unless-stopped
    mem_limit: 384m
    environment:
      NUXT_PUBLIC_DIRECTUS_URL: ${NUXT_PUBLIC_DIRECTUS_URL}
      NUXT_DIRECTUS_SERVER_URL: ${NUXT_DIRECTUS_SERVER_URL}
    networks:
      - webnet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  webnet:
    external: true
